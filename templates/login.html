<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Gérant - Hôtel Le Prestige</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --fond-principal: #f7f5f0;
            --carte-fond: #ffffff;
            --couleur-texte: #2d2a26;
            --cuivre: #b87333;
            --cuivre-fonce: #965a25;
            --filet: #e2ded4;
            --erreur-fond: #fdf2f2;
            --erreur-bord: #f5c6cb;
            --erreur-texte: #9e2a2b;
        }

        body {
            background: var(--fond-principal);
            background-image:
                radial-gradient(ellipse 70% 50% at 50% -10%, rgba(184, 115, 51, 0.08), transparent),
                radial-gradient(ellipse 60% 40% at 50% 110%, rgba(184, 115, 51, 0.04), transparent);
            font-family: 'Inter', sans-serif;
            color: var(--couleur-texte);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-box {
            position: relative;
            width: 420px;
            max-width: 100%;
            background: linear-gradient(175deg, var(--carte-fond), #faf8f5);
            border: 1px solid var(--filet);
            padding: 56px 44px 40px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(45, 42, 38, 0.1);
            opacity: 0;
            transform: translateY(14px);
            animation: entree 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes entree {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        /* Coins d'angle art déco */
        .login-box::before,
        .login-box::after,
        .coin-bd,
        .coin-bg {
            content: '';
            position: absolute;
            width: 22px;
            height: 22px;
            border: 1px solid var(--cuivre);
            opacity: 0.6;
        }
        .login-box::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
        .login-box::after  { top: -1px; right: -1px; border-left: none; border-bottom: none; }
        .coin-bd { bottom: -1px; right: -1px; border-left: none; border-top: none; }
        .coin-bg { bottom: -1px; left: -1px; border-right: none; border-top: none; }

        /* Monogramme */
        .monogramme {
            width: 56px;
            height: 56px;
            margin: 0 auto 22px;
            border: 1px solid var(--cuivre);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', serif;
            font-size: 1.15em;
            font-weight: 500;
            letter-spacing: 1px;
            color: var(--cuivre-fonce);
            background: rgba(184, 115, 51, 0.04);
        }

        .login-box h1 {
            font-family: 'Fraunces', serif;
            font-weight: 600;
            font-size: 1.85em;
            letter-spacing: 0.3px;
            color: var(--couleur-texte);
            margin-bottom: 10px;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .divider span {
            font-size: 0.72em;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--cuivre);
            font-weight: 500;
        }
        .divider::before,
        .divider::after {
            content: '';
            width: 34px;
            height: 1px;
            background: var(--filet);
        }

        .erreur {
            background: var(--erreur-fond);
            border: 1px solid var(--erreur-bord);
            color: var(--erreur-texte);
            padding: 11px 14px;
            margin-bottom: 24px;
            font-size: 0.85em;
            font-weight: 500;
            text-align: left;
            animation: shake 0.4s ease-in-out;
        }

        .form-group {
            text-align: left;
            margin-bottom: 26px;
        }

        .form-group label {
            display: block;
            color: var(--cuivre-fonce);
            margin-bottom: 9px;
            font-weight: 600;
            font-size: 0.72em;
            letter-spacing: 1.6px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 10px 8px;
            border: none;
            border-bottom: 1px solid var(--filet);
            background: transparent;
            color: var(--couleur-texte);
            font-size: 1em;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .form-group input::placeholder {
            color: #b3aea3;
        }

        .form-group input:focus {
            outline: none;
            border-bottom-color: var(--cuivre);
            box-shadow: 0 4px 12px -4px rgba(184, 115, 51, 0.25);
        }

        .form-group input:focus-visible {
            outline: 2px solid var(--cuivre);
            outline-offset: 4px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            margin-top: 6px;
            border: 1px solid var(--cuivre);
            background: var(--cuivre);
            color: #ffffff;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.8em;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background 0.3s ease, border-color 0.3s ease, transform 0.1s ease;
        }

        .btn:hover {
            background: var(--cuivre-fonce);
            border-color: var(--cuivre-fonce);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn:focus-visible {
            outline: 2px solid var(--cuivre);
            outline-offset: 4px;
        }

        .footer {
            margin-top: 30px;
            color: #8c8576;
            font-size: 0.72em;
            letter-spacing: 0.5px;
            line-height: 1.7;
        }

        @media (prefers-reduced-motion: reduce) {
            .login-box, .erreur {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        @media (max-width: 480px) {
            .login-box {
                padding: 44px 26px 32px;
            }
            .login-box h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="coin-bd"></div>
        <div class="coin-bg"></div>

        <div class="monogramme">LP</div>

        <h1>Hôtel Le Prestige</h1>
        <div class="divider"><span>Espace gérant</span></div>

        {% if erreur %}
            <div class="erreur">{{ erreur }}</div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="gerant_nom">Nom du gérant</label>
                <input
                    type="text"
                    id="gerant_nom"
                    name="gerant_nom"
                    placeholder="Ex : Elysé, Jean..."
                    required>
            </div>

            <div class="form-group">
                <label for="mot_de_passe">Mot de passe administrateur</label>
                <input
                    type="password"
                    id="mot_de_passe"
                    name="mot_de_passe"
                    placeholder="Saisissez votre mot de passe"
                    required>
            </div>

            <button type="submit" class="btn">Accéder à l'espace</button>

        </form>

        <div class="footer">
            © {{ now().year if now else "2026" }} Hôtel Le Prestige<br>
            Accès réservé au personnel autorisé.
        </div>
    </div>

</body>
</html>
